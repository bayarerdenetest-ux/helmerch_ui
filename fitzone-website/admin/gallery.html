    <div class="admin-topbar d-flex align-items-center justify-content-between p-3 mb-4">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-light d-lg-none" id="sidebarToggle" aria-label="Цэс"><i class="bi bi-list"></i></button>
        <h1 class="h5 mb-0">Галерей — альбомын зураг</h1>
      </div>
      <div class="d-flex align-items-center gap-3">
        <span class="small text-muted d-none d-sm-inline">admin@fitzone.mn</span>
        <div class="icon-circle" style="width:40px;height:40px;font-size:1rem"><i class="bi bi-person-fill"></i></div>
      </div>
    </div>
    <div data-entity="gallery" class="card kpi-card">
      <div class="card-body">
        <div class="d-flex flex-wrap gap-2 justify-content-between mb-3">
          <input id="crudSearch" class="form-control" style="max-width:320px" type="search" placeholder="Хайх...">
          <div class="d-flex gap-2">
            <button id="crudExport" class="btn btn-light"><i class="bi bi-download me-1"></i>CSV</button>
            <button id="crudAdd" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Зураг нэмэх</button>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light"><tr id="crudHead"></tr></thead>
            <tbody id="crudBody"></tbody>
          </table>
        </div>
        <div class="small text-muted mt-3">Харуулж буй: <span id="crudCount"></span></div>
      </div>
    </div>
    <div class="modal fade" id="crudModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <form class="modal-content" id="crudForm" novalidate>
          <div class="modal-header"><h5 class="modal-title" id="crudModalTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Хаах"></button></div>
          <div class="modal-body"><div class="row g-3" id="crudFields"></div></div>
          <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Болих</button><button type="submit" class="btn btn-primary">Хадгалах</button></div>
