apiVersion: apps/v1
kind: Deployment
metadata:
  name: helmerch-web
spec:
  replicas: 2
  selector:
    matchLabels: { app: helmerch-web }
  template:
    metadata:
      labels: { app: helmerch-web }
    spec:
      containers:
        - name: web
          image: helmerch:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: helmerch-web
spec:
  type: NodePort
  selector: { app: helmerch-web }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
